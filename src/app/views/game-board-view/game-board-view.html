@if (gameState(); as state) {
  <div class="game-layout">
    <app-game-header />
    
    <main class="game-content">
      <div class="left-panel">
        <app-rooms-panel />
      </div>
      
      <div class="center-panel">
        <app-task-list />
      </div>
      
      <div class="right-panel">
        <app-player-panel />
      </div>
    </main>
  </div>
} @else {
  <div class="no-game">
    <div class="no-game-content">
      <i class="bi bi-controller"></i>
      <h2>Игра не запущена</h2>
      <p>Создайте персонажа для начала игры</p>
      <a routerLink="/setup" class="start-btn">
        <i class="bi bi-play-fill"></i>
        Создать персонажа
      </a>
    </div>
  </div>
}
